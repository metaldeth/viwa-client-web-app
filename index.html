    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        color: #fff;
      }

      #root {
        min-height: 100%;
        min-height: 100dvh;
        background: #000;
      }

      #viwa-app-boot {
        position: fixed;
        inset: 0;
        z-index: 2147483646;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
        background: #000;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        min-height: 100vh;
        min-height: 100dvh;
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transition:
          opacity 0.275s ease,
          visibility 0s linear 0s;
      }

      #viwa-app-boot.viwa-app-boot--fade-out {
        opacity: 0;
        pointer-events: none;
      }

      #viwa-app-boot.viwa-app-boot--hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition:
          opacity 0.275s ease,
          visibility 0s linear 0.275s;
      }

      @media (prefers-reduced-motion: reduce) {
        #viwa-app-boot,
        #viwa-app-boot.viwa-app-boot--hidden {
          transition-duration: 0.1s;
        }

        #viwa-app-boot.viwa-app-boot--hidden {
          transition:
            opacity 0.1s ease,
            visibility 0s linear 0.1s;
        }
      }

      #viwa-app-boot::before {
        content: '';
        position: absolute;
        top: -18%;
        left: 50%;
        width: min(120vw, 520px);
        height: min(55vh, 360px);
        transform: translateX(-50%);
        background: radial-gradient(
          ellipse at center top,
          rgba(127, 90, 240, 0.28) 0%,
          rgba(80, 40, 160, 0.1) 42%,
          transparent 72%
        );
        pointer-events: none;
      }

      .viwa-app-boot__inner {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: min(100%, 430px);
        padding: 24px;
        box-sizing: border-box;
        text-align: center;
      }

      .viwa-app-boot__logo {
        display: block;
        width: 120px;
        height: auto;
        color: #fff;
        flex-shrink: 0;
      }

      .viwa-app-boot__shimmer {
        display: flex;
        gap: 6px;
        margin-top: 28px;
        flex-shrink: 0;
      }

      .viwa-app-boot__shimmer span {
        display: block;
        width: 40px;
        height: 3px;
        border-radius: 999px;
        background: linear-gradient(90deg, #7f5af0 0%, #3b82f6 50%, #00e5ff 100%);
        background-size: 200% 100%;
        animation: viwa-boot-shimmer 1.4s ease-in-out infinite;
      }

      .viwa-app-boot__shimmer span:nth-child(2) {
        animation-delay: 0.15s;
      }

      .viwa-app-boot__shimmer span:nth-child(3) {
        animation-delay: 0.3s;
      }

      @keyframes viwa-boot-shimmer {
        0%,
        100% {
          opacity: 0.35;
          background-position: 0% 50%;
        }
        50% {
          opacity: 1;
          background-position: 100% 50%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .viwa-app-boot__shimmer span {
          animation: none;
          opacity: 0.7;
        }
      }

      .viwa-app-boot__status {
        margin: 20px 0 0;
        font-size: 15px;
        line-height: 1.4;
        letter-spacing: 0.01em;
        color: rgba(255, 255, 255, 0.72);
      }

      .viwa-app-boot__error {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        margin-top: 20px;
        max-width: 320px;
        width: 100%;
        padding-bottom: 8px;
      }

      #viwa-app-boot[data-boot-state='error'] .viwa-app-boot__shimmer,
      #viwa-app-boot[data-boot-state='error'] .viwa-app-boot__status {
        display: none;
      }

      #viwa-app-boot[data-boot-state='error'] .viwa-app-boot__error {
        display: flex;
      }

      #viwa-app-boot[data-boot-state='error'] {
        align-items: flex-start;
        padding-top: max(24px, env(safe-area-inset-top));
      }

      .viwa-app-boot__error-title {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
        color: #fff;
      }

      .viwa-app-boot__error-hint {
        margin: 0;
        font-size: 14px;
        line-height: 1.45;
        color: rgba(255, 255, 255, 0.62);
      }

      .viwa-app-boot__retry {
        min-height: 44px;
        min-width: 44px;
        margin-top: 4px;
        padding: 10px 20px;
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
        font: inherit;
        font-size: 15px;
        font-weight: 500;
        cursor: pointer;
      }

      .viwa-app-boot__retry:focus-visible {
        outline: 2px solid #7f5af0;
        outline-offset: 2px;
      }

  <body>
    <div id="viwa-app-boot" role="status" aria-live="polite" aria-busy="true" aria-label="Загрузка">
      <div class="viwa-app-boot__inner">
        <svg
          class="viwa-app-boot__logo"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 277 150"
          role="img"
          aria-label="VIWA"
        >
          <g transform="scale(1 0.617284)">
            <path
              fill="currentColor"
              fill-rule="evenodd"
              d="M0 4L1 0 27 1 30 138 33 191 39 1 65 0 52 221 25 227 12 226ZM13 242L13 229 52 226 51 243ZM100 235L99 243 73 242 73 222 97 214 99 214ZM74 215L74 0 100 1 99 206ZM211 0L202 163 198 166 165 178 164 141 160 96 155 182 122 197 119 197 109 17 109 0 136 0 140 161 142 164 147 1 173 1 179 156 184 0ZM120 216L120 206 154 193 151 243 122 243ZM201 175L196 243 168 242 166 204 167 187ZM238 162L236 242 210 243 213 170ZM214 148L223 0 263 1 271 127 271 143 269 144 236 152 215 160ZM248 161L248 158 250 157 272 151 277 234 277 243 251 243ZM238 145L238 150 248 148 243 37Z"
            />
          </g>
        </svg>
        <div class="viwa-app-boot__shimmer" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </div>
        <p class="viwa-app-boot__status" data-boot-status hidden>Загрузка…</p>
        <div
          class="viwa-app-boot__error"
          data-boot-error
          role="alert"
          aria-live="assertive"
          aria-atomic="true"
          hidden
        >
          <p class="viwa-app-boot__error-title">Не удалось загрузить кабинет</p>
          <p class="viwa-app-boot__error-hint">
            Проверьте подключение к интернету и попробуйте снова.
          </p>
          <button type="button" class="viwa-app-boot__retry" data-boot-retry>Повторить</button>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script>
      (function () {
        var boot = document.getElementById('viwa-app-boot');
        if (!boot) return;

        var loadingTextTimer = window.setTimeout(function () {
          if (boot.getAttribute('data-boot-state') === 'error') return;
          var status = boot.querySelector('[data-boot-status]');
          if (status) status.hidden = false;
        }, 3000);

        var errorTimer = window.setTimeout(function () {
          boot.setAttribute('data-boot-state', 'error');
          boot.setAttribute('aria-busy', 'false');
          boot.setAttribute('aria-label', 'Ошибка загрузки');
          var status = boot.querySelector('[data-boot-status]');
          if (status) status.hidden = true;
          var errorBlock = boot.querySelector('[data-boot-error]');
          if (errorBlock) errorBlock.hidden = false;
          var retry = boot.querySelector('[data-boot-retry]');
          if (retry) retry.focus();
        }, 18000);

        function clearBootTimers() {
          window.clearTimeout(loadingTextTimer);
          window.clearTimeout(errorTimer);
        }

        function resetBootErrorState() {
          boot.removeAttribute('data-boot-state');
          boot.setAttribute('role', 'status');
          boot.setAttribute('aria-live', 'polite');
          boot.setAttribute('aria-busy', 'true');
          boot.removeAttribute('aria-hidden');
          var errorBlock = boot.querySelector('[data-boot-error]');
          if (errorBlock) errorBlock.hidden = true;
        }

        function onBootReady() {
          clearBootTimers();
          window.removeEventListener('viwa:app-boot-ready', onBootReady);
          window.removeEventListener('viwa:app-boot-updating', onBootUpdating);
        }

        function onBootUpdating() {
          clearBootTimers();
          resetBootErrorState();
          window.removeEventListener('viwa:app-boot-ready', onBootReady);
          window.removeEventListener('viwa:app-boot-updating', onBootUpdating);
        }

        window.addEventListener('viwa:app-boot-ready', onBootReady);
        window.addEventListener('viwa:app-boot-updating', onBootUpdating);

        var retry = boot.querySelector('[data-boot-retry]');
        if (retry) {
          retry.addEventListener('click', function () {
            window.location.reload();
          });
        }
      })();
    </script>
    <script type="module" src="/src/index.tsx"></script>
